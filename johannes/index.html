<style>
:root{--bg:#faf7f2;--card:#ffffff;--ink:#26323b;--soft:#6b7782;--line:#e6dfd3;--hdr:#2d3f4d;--hdr-ink:#fff;--accent:#d9822b;--accent-bg:#fdf0df;--now:#fff6d6;--mine:#e8f1f7;--shadow:0 1px 0 rgba(0,0,0,.04),0 6px 18px rgba(45,63,77,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#161d23;--card:#1f2830;--ink:#e9edf0;--soft:#9aa7b1;--line:#2c3844;--hdr:#0f161b;--hdr-ink:#f4f6f8;--accent:#f0a04b;--accent-bg:#3a2c1b;--now:#3a3418;--mine:#1d3140;--shadow:0 6px 18px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:150px;scroll-padding-bottom:240px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(230px + env(safe-area-inset-bottom))}
button,select{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:20;background:var(--hdr);color:var(--hdr-ink);padding:max(10px,env(safe-area-inset-top)) 14px 0;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.title h1{margin:0;font:700 19px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.2px}
.title span{font-size:12.5px;opacity:.72}
.tabs{display:flex;gap:4px;margin-top:8px}
.tab{flex:1;border:0;background:transparent;color:inherit;opacity:.65;padding:9px 4px 10px;font-weight:700;font-size:15px;border-bottom:3px solid transparent;cursor:pointer}
.tab.on{opacity:1;border-bottom-color:var(--accent)}
.bar{display:flex;gap:8px;align-items:center;margin:12px 0 8px;flex-wrap:wrap}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:700;cursor:pointer}
.seg button.on{background:var(--hdr);color:var(--hdr-ink)}
main{max-width:720px;margin:0 auto;padding:0 14px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:10px 0;box-shadow:var(--shadow)}
.panel summary{cursor:pointer;font-weight:700;list-style:none;display:flex;justify-content:space-between;align-items:center}
.panel summary::-webkit-details-marker{display:none}
.panel .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px}
.chk{display:flex;align-items:center;gap:8px;font-size:14.5px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
select{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px}
.hint{font-size:12.5px;color:var(--soft);margin:6px 2px}
.scene{margin:22px 0 8px;padding:10px 12px;border-radius:12px;background:var(--hdr);color:var(--hdr-ink);display:flex;justify-content:space-between;gap:10px;align-items:baseline;cursor:pointer}
.scene b{font:700 16px/1.3 Georgia,serif}
.scene small{opacity:.75;white-space:nowrap}
.line{position:relative;margin:6px 0;padding:9px 12px 10px 14px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sc,var(--line));border-radius:12px;cursor:pointer}
.line .sp{display:flex;gap:8px;align-items:center;font-size:12.5px;font-weight:800;letter-spacing:.3px;text-transform:uppercase;color:var(--sc,var(--soft))}
.line .sp i{font-style:normal;font-weight:600;color:var(--soft);text-transform:none;letter-spacing:0;margin-left:auto}
.line .tx{font:17.5px/1.5 Georgia,"Times New Roman",serif;margin-top:2px}
.line .tx em{color:var(--soft);font-style:italic}
.line.mine{background:var(--mine)}
.line.mine .sp:after{content:"★";color:var(--accent);margin-left:2px}
.line.now{background:var(--now);box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.conceal .line.mine:not(.peek) .tx{filter:blur(7px);user-select:none}
.line.off{display:none}
.scenecard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;margin:10px 0;box-shadow:var(--shadow);cursor:pointer}
.scenecard.now{box-shadow:0 0 0 2px var(--accent),var(--shadow);background:var(--now)}
.scenecard b{display:block;font:700 17px/1.3 Georgia,serif}
.scenecard span{font-size:13px;color:var(--soft)}
.parthead{margin:22px 2px 4px;font-weight:800;color:var(--soft);text-transform:uppercase;font-size:12.5px;letter-spacing:.6px}
.follow{position:fixed;right:14px;bottom:calc(226px + env(safe-area-inset-bottom));z-index:30;border:0;border-radius:999px;background:var(--accent);color:#1d1306;font-weight:800;padding:10px 14px;box-shadow:0 6px 18px rgba(0,0,0,.3);display:none;cursor:pointer}
.player{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--hdr);color:var(--hdr-ink);padding:10px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.25);border-radius:18px 18px 0 0}
.pin{max-width:720px;margin:0 auto}
.now-line{font-size:12.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.seekrow{display:flex;align-items:center;gap:10px;margin:6px 0 4px;font-variant-numeric:tabular-nums;font-size:12.5px}
.seekwrap{position:relative;flex:1;height:28px}
.seekwrap input{position:absolute;inset:0;width:100%;margin:0;background:transparent;accent-color:var(--accent);height:28px}
.ticks{position:absolute;left:0;right:0;top:11px;height:6px;pointer-events:none}
.ticks i{position:absolute;top:0;width:2px;height:6px;background:rgba(255,255,255,.55);border-radius:1px}
.ctl{display:flex;justify-content:center;align-items:center;gap:6px}
.ctl button{border:0;background:rgba(255,255,255,.12);color:inherit;border-radius:14px;min-width:44px;height:44px;font-weight:800;cursor:pointer;padding:0 10px}
.ctl .play{background:var(--accent);color:#1d1306;min-width:64px;height:52px;font-size:22px;border-radius:18px}
.ctl2{margin-top:8px}.ctl .mine{background:rgba(240,160,75,.3);font-size:13px;padding:0 12px;height:38px;flex:1}.ctl2 select{height:38px}
.ctl select{background:rgba(255,255,255,.12);border:0;color:inherit;height:44px;border-radius:14px}
.ctl select option{color:#222}
.msg{font-size:13px;text-align:center;margin-top:6px;opacity:.9;min-height:18px}
.msg button{border:0;border-radius:10px;padding:4px 10px;margin-left:6px;font-weight:700;cursor:pointer}
.prog{height:6px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;margin:6px 0;display:none}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.install{font-size:14px;line-height:1.6}
.install b{display:inline-block;min-width:74px}
</style>

"t":203.0,"s":"Kater","d":"Mau","p":3},{"t":206.0,"s":"Müller","d":"Ja! Ja, so ist es fein.","p":3},{"t":223.6,"s":"Kater","d":"Mauuu","p":3},{"t":226.5,"s":"Müller","d":"Komm schon.","p":3},{"t":227.4,"s":"Mau","d":"Mau","p":3},{"t":236.9,"s":"Müller","d":"Ha!","p":3,"sc":"Die Szene am Teich"},{"t":246.4,"s":"Kater","d":"und entkommt","p":3},{"t":265.5,"s":"Müller","d":"AAAAAHHHHH!","p":3},{"t":275.0,"s":"Kater","d":"Mauuuuu.","p":3},{"t":284.6,"s":"Müller","d":"Hey! Komm da runter!","p":4},{"t":286.2,"s":"Kater","d":"Miau","p":4},{"t":293.8,"s":"Müller","d":"Ich lass dich nicht da oben sitzen! Du bist meine Erbschaft! Mehr hat Vater mir nicht hinterlassen.","p":4},{"t":324.7,"s":"Müller","d":"Komm, so hoch ist das nicht. KOMM runter!","p":4},{"t":328.1,"s":"Kater","d":"Miau","p":4},{"t":342.5,"s":"Müller","d":"Gut. Dann eben so!","p":4},{"t":350.2,"s":"Müller","d":"Hab dich! Schluss jetzt mit dem Katz und Maus Spiel. Her mit der Pfote.","p":4},{"t":356.1,"s":"Kater","d":"Mau!","p":4},{"t":367.6,"s":"Müller","d":"Ah! Spinnst du?","p":4},{"t":369.0,"s":"Müller","d":"Ich zieh dir das Fell über die Ohren und lass beim Schneider Handschuhe daraus nähen.","p":4},{"t":381.2,"s":"Müller","d":"...oder eine Mütze...jetzt, wo ich kein Dach mehr über dem Kopf habe. Warum hat Vater nicht mir die Mühle vererbt? Au","p":4},{"t":396.5,"s":"Müller","d":"Lass mich.","p":5},{"t":397.4,"s":"Kater","d":"Ich Mau!","p":5},{"t":411.4,"s":"Müller","d":"He?","p":5},{"t":418.4,"s":"Kater","d":"Ich mach dich zum reichsten Mann der Stadt!","p":5},{"t":433.3,"s":"Müller","d":"Wer ist da?","p":5},{"t":434.6,"s":"Kater","d":"Miiiiauuuuuuu!","p":5},{"t":434.8,"s":"Kater","d":"Ich mache dich so reich wie die Königin!","p":5},{"t":440.0,"s":"Müller","d":"Ich ... ich werd verrückt!","p":5},{"t":444.2,"s":"Müller","d":"Klares Wasser! Klares Wasser, klarer Kopf!","p":5},{"t":456.1,"s":"Kater","d":"Du piepst wie eine Maus.","p":6},{"t":458.9,"s":"Müller","d":"Du... du... du redest wie ein Mensch!","p":6},{"t":464.8,"s":"Kater","d":"Wir können beide mehr als wir dachten.","p":6},{"t":473.8,"s":"Kater","d":"...oder weniger! Hör zu! Was ist besser? Ein Dach über dem Kopf, oder eine Fellmütze auf dem Kopf?","p":6},{"t":485.4,"s":"Müller","d":"...das Dach?","p":6},{"t":486.4,"s":"Kater","d":"Ich bin froh, dass du das sagst.","p":6},{"t":489.8,"s":"Müller","d":"Aber die Mütze ist zum Greifen nah.","p":6},{"t":492.3,"s":"Kater","d":": Gib mir nur etwas Zeit. Ich mache dich reicher als die Königin!","p":6},{"t":497.1,"s":"Müller","d":"Das wird ja immer besser! Dann machst du mich so reich wie den Zauberer, ja?","p":6},{"t":503.3,"s":"Kater","d":"Ich denke....","p":6},{"t":504.1,"s":"Müller","d":"Du denkst? Na klar!","p":6},{"t":507.2,"s":"Kater","d":"Ich denke .. Das lässt sich machen. Gib mir nur ein paar Stiefel!","p":6},{"t":516.6,"s":"Müller","d":"Stiefel?","p":7},{"t":518.2,"s":"Kater","d":"So kann ich doch nicht unter die Leute gehen. Da nimmt mich keiner ernst. Mau.","p":7},{"t":526.6,"s":"Müller","d":"Das sind die einzigen Stiefel, die ich besitze.","p":7},{"t":531.8,"s":"Kater","d":"Die haben ein Loch!","p":7},{"t":534.1,"s":"Müller","d":"Und wessen Schuld ist das wohl?","p":7},{"t":537.6,"s":"Kater","d":"Mäuse?","p":7},{"t":537.9,"s":"Müller","d":"Ah... ich muss verrückt sein. Ich muss verhext sein. Ha! Hier! Fang!","p":7},{"t":545.8,"s":"Kater","d":"Du gibst sie mir?","p":7},{"t":549.3,"s":"Müller","d":"Aus purer Verzwei ung! Minkus?! Wenn du mich reinlegst....","p":7},{"t":558.2,"s":"Kater","d":"...ziehst du mir das Fell über die Ohren...ich weiß! Lass mich nur machen. Und Du: Mach dich auf die Socken.","p":7},{"t":571.7,"s":"Müller","d":"Ha! Ha! Ich werde es bereuen.","p":7},{"t":574.3,"s":"Kater","d":"Auf Wiedersehen!","p":7},{"t":616.6,"s":"Kater","d":"Eijeijei! Wie halten Zweibeiner das den ganzen Tag aus?","p":8},{"t":652.6,"s":"Zauberer","d":"Wo drückt denn der Schuh?","p":8},{"t":654.8,"s":"Kater","d":"Z-z-z-zauberer Zampaaaaaano!","p":8},{"t":658.7,"s s":"Publikum","d":"NEEEEEIN!","p":22},{"t":2010.7,"s":"Kater","d":"Jetzt mach schon. Die Prinzessin kommt bald.","p":22},{"t":2023.2,"s":"Kater","d":"Beeil dich!","p":22},{"t":2025.5,"s":"Müller","d":"Äh, was machst du mit meinen Sachen!","p":22},{"t":2031.3,"s":"Kater","d":"Schschsch! : Ihr habt nichts gesehen, ja?!","p":22},{"t":2033.8,"s":"Müller","d":"ohohoh, kalt!","p":22},{"t":2044.3,"s":"Prinzessin","d":"Hallooooo! Mama! Da ist der gestiefelte Kater mit den schönen Schnurrhaaren.","p":22},{"t":2052.1,"s":"Kater","d":"Eure Majestät! Prinzessin! Welch Zufall. Welch Glück! Ooooch! Große Not! Große Not. Seht da! Mein Graf! Er ist im Wasser gefangen.","p":22},{"t":2064.2,"s":"Königin","d":"Ach, mon Dieu! Ja, warum denn?","p":22},{"t":2066.9,"s":"Kater","d":"Diebe! Diebe! Sie haben ihm die Kleider gestohlen. Der Graf wollte nur ein Bad nehmen. Es waren zu viele, sonst hätte ich den Bastarden die Augen ausgekratzt. Haben die Rebhühner geschmeckt?","p":23},{"t":2084.3,"s":"Königin","d":"Ausgezeichnet. Ausgezeichnet.","p":23},{"t":2089.1,"s":"Prinzessin","d":"Huhu! Herr Graf! Graf Carabaaaaaas! Wir haben ein Handtuch dabei!","p":23},{"t":2098.1,"s":"Prinzessin","d":"Wo sind sie denn?","p":23},{"t":2099.8,"s":"Müller","d":"P-p-p-rinz-z-z-z essin. H-h-h-h-h-alloo....","p":23},{"t":2107.4,"s":"Prinzessin","d":"Ist es kalt?","p":23},{"t":2111.1,"s":"Königin","d":"Wir geleiten euch selbstverständlich in meiner Kutsche zu eurem Anwesen. Damit der Herr Graf sich neu kleiden kann.","p":23},{"t":2124.4,"s":"Kater","d":"...unser... Anwesen...?","p":23},{"t":2126.1,"s":"Königin","d":"Ja! Euer Schloss.","p":23},{"t":2127.7,"s":"Kater","d":"Miau... och unser Anwesen.... Majestät. Wir sind heute nicht vorbereitet euch zu empfangen. Die Königin höchst selbst!","p":23},{"t":2134.9,"s":"Prinzessin","d":"Haaaalloooo!","p":23},{"t":2142.6,"s":"Müller","d":"Ha-h-hallo...","p":24},{"t":2150.3,"s":"Müller","d":"Ah....Whou! Hier stimmt was nicht! Hilfe!!!!","p":24},{"t":2152.8,"s":"Zauberer","d":"Zack Zack ZAMPANO!","p":24},{"t":2173.9,"s":"Müller","d":"Was geht denn hier ab? Whou! Ich ertrinke!","p":24},{"t":2177.3,"s":"Prinzessin","d":"Mama! Er ertrinkt!","p":24},{"t":2178.3,"s":"König","d":"Ach Kind! Jetzt kreisch doch nicht so!","p":24},{"t":2180.0,"s":"Müller","d":"So helft mir doch! Hilfe! Whou!","p":24},{"t":2181.9,"s":"Prinzessin","d":"Greift meine Hand.","p":24},{"t":2183.2,"s":"Müller","d":"Aaah! Beim nächsten Mal. Hilfeeeee! Wo geht’s denn hier lang?","p":24},{"t":2190.5,"s":"Prinzessin","d":"Hier her! Hier!","p":24},{"t":2192.7,"s":"Königin","d":"Kind! Nein Kind! Bleib von dem Wasser fern.","p":25},{"t":2198.6,"s":"Müller","d":"Oh! Ich ertrinke!","p":25},{"t":2200.8,"s":"Prinzessin","d":"Graf!","p":25},{"t":2201.5,"s":"Müller","d":"Ich ertrinke","p":25},{"t":2212.6,"s":"Prinzessin","d":"Mama! .... Jetzt!","p":25},{"t":2213.9,"s":"Müller","d":"Aaah! Fast!","p":25},{"t":2214.9,"s":"Prinzessin","d":"Nächstes mal! Graf! Bitte! Hier!","p":25},{"t":2218.8,"s":"Müller","d":"Aaah Knapp.","p":25},{"t":2220.0,"s":"Müller","d":"Ich glaube jetzt! Jetzt, jetzt! Aaah! Doch nicht! Einen Versuch haben wir noch.","p":25},{"t":2229.8,"s":"Prinzessin","d":"Tut doch was!","p":25},{"t":2231.3,"s":"Kater","d":"Ich bin Wasserscheu. He,he, he...Aber wie es aussieht, läuft das Wasser sowieso ab!","p":25},{"t":2236.7,"s":"Prinzessin","d":"Graf Carabas!","p":25},{"t":2266.2,"s":"Prinzessin","d":"Graf Carabas!","p":25},{"t":2267.9,"s":"Müller","d":"Wer ist Graf Carabas. Ich bin doch nur ein Müll....","p":25},{"t":2272.1,"s":"Prinzessin","d":"Müll?","p":26},{"t":2277.3,"s":"Kater","d":"Er spricht immer sehr bescheiden von sich.","p":26},{"t":2283.1,"s":"Müller","d":"Ha!","p":26},{"t":2285.9,"s":"Müller","d":"Ha!","p":26},{"t":2288.7,"s":"Kater","d":"Mein \"Graf\"!","p":26},{"t":2289.5,"s":"Müller","d":"Was soll das hier?! Ich geb dir meine Schuhe, du klaust mir meine letzten Kleider und machst mich lächerlich.","p":26},{"t":2297.1,"s":"Kater","d":"Mau! Ohne mich hättest du nie die Prinzessin getro en!","p":26},{"t":2301.1,"s":"Müller","d":"Sie wird beeindruckt sein von einem Müller in Unterhosen.","p":26},{"t":2305.8,"s":"Königin","d":"Alles in Ordnung meine Herren?","p":26},{"t":2308.5,"s":"Kater","d":"Ja, ja! Selbstverständlich. Wir nehmen ihr Angebot gern an, den Grafen auf ihr Schloss zu fahren, um ihm trockene Kleider zu geben.","p":26},{"t":2319.6,"s":"Prinzessin","d":"Wie nett von dir Mama! Hast du das vorgeschlagen?","p":27},{"t":2324.2,"s":"Königin","d":"Äh...nein. So eigentlich nicht.","p":27},{"t":2327.1,"s":"Kater","d":"Majestät, wir stehen tief in ihrer Schuld.","p":27},{"t":2336.0,"s":"Königin","d":"Begleitest du uns nicht?","p":27},{"t":2338.4,"s":"Kater","d":"Ich komme nach, Majestät.","p":27},{"t":2343.6,"s":"Königin","d":"Das ist eine sehr gefährlicher Ort hier! Gar nicht auszudenken, wenn meine Tochter hier gebadet hätte!","p":27},{"t":2352.7,"s":"Kater","d":"Könntet ihr den See nicht sperren?","p":27},{"t":2358.5,"s":"Königin","d":"Dieser See gehört dem Zauberer Zampanoooooo!","p":27},{"t":2364.8,"s":"Kater","d":"Ach soooo! Dem gehört aber vieles.","p":27},{"t":2368.9,"s":"Königin","d":"Ja. Bekanntermaßen ist er noch reicher als ich. Was für eine Schmach. Ach, ich würd zu gerne einmal das Schloss sehen von diesem Angeber. Es weiß aber niemand, wo es steht.","p":27},{"t":2384.1,"s":"Kater","d":"ICH könnte das Schloss aufspüren! Ich besitze 60 Millionen Riechzellen, Eure Majestät. Mit Verlaub. Die menschliche Spezies hat gerade einmal 5 Millionen.","p":27},{"t":2398.1,"s":"Königin","d":"60 Millionen! Beeindruckend!","p":27},{"t":2407.0,"s":"Prinzessin","d":"Mama! Komm doch endlich!","p":27},{"t":2413.2,"s":"Prinzessin","d":"Ist euch kalt?","p":28},{"t":2414.4,"s":"Müller","d":"Ja gar nicht. Nein, mmh.","p":28},{"t":2437.1,"s":"Kater","d":"Zampanooooo. Zampanooooo. FALLS du das warst mit dem Wasser! Danke! Für den Fisch. Hätte ich ohne deine \"Hilfe\" nicht gefangen!","p":28},{"t":2474.2,"s":"Zauberer","d":"FALLS!? FALLS ich das war mit dem Wasser?! Wer außer mir, wäre dazu in der Lage! SAGT ES! Nur ICH bin es! ZACK ZACK Zampanoooooooooo!","p":28},{"t":2561.0,"s":"Kater","d":"Wem gehört diese schöne Wiese?","p":28,"sc":"Die Teppich-Szene · Einkauf, Walzer und Mücken"},{"t":2565.0,"s":"Gärtnerin","d":"Dem Zauberer Zampano. ANNIE","p":28},{"t":2567.4,"s":"Kater","d":"Ich gebe euch 5 Goldmünzen. Aber ihr MÜSST sagen, dass diese Wiese dem Grafen Carabas gehört, wenn die Prinzessin fragt.","p":29},{"t":2581.0,"s":"Gärtnerin","d":"Ca-ra-bas? ANNIE","p":29},{"t":2581.8,"s":"Kater","d":"Carabas!","p":29},{"t":2587.8,"s":"Bäuerin","d":"Na! CONST","p":29},{"t":2589.0,"s":"Kater","d":"Miau! Verzeihung. Das war mein altes ich. Wem gehören diese Eier?","p":29},{"t":2593.6,"s":"Bäuerin","d":"ZAMPANOOOOO. CONST","p":29},{"t":2598.4,"s":"Kater","d":"Ich gebe euch 3 Goldmünzen, wenn ihr mir sie verkauft.","p":29},{"t":2605.8,"s":"Bäuerin","d":"So viele? Danke! CONST","p":29},{"t":2609.5,"s":"Kater","d":"Wem gehört diese wunderschöne Kuh, mit dem prall gefüllten Milch-Euter?","p":29},{"t":2618.2,"s":"Kater","d":"Ich gebe euch zehn Goldmünzen, wenn ihr sie mir verkauft ...Nicht für mich! für den Grafen Carabas.","p":29},{"t":2626.7,"s":"Bauer","d":"Das geht nicht. Die gehört dem Zauberer. Der bringt mich um. FRANK","p":29},{"t":2632.1,"s":"Kater","d":"Ich verstehe. Bei einer Kuh würde ich auch keinen Spaß verstehen.","p":29},{"t":2638.1,"s":"Kater","d":"Könnten Sie für mich dreimal in die Hände klatschen?","p":30},{"t":2641.9,"s":"Bauer","d":"Hä? FRANK","p":30},{"t":2643.8,"s":"Kater","d":"Bei mir kommt kein Ton...","p":30},{"t":2647.5,"s":"Bauer","d":"Ach sooooo! Er klatscht drei mal laut. FRANK","p":30},{"t":2651.9,"s":"Kater","d":"Ihr Leute! Ihr Leute! Hört! Wenn die Prinzessin fragt, wem all das hier gehört, So antwortet bitte: Graf Carabas!","p":30},{"t":2670.3,"s":"Kater","d":"Also: wir proben: Wem gehört das alles hier?","p":30},{"t":2673.6,"s":"Publikum","d":"Graf Carabas!","p":30},{"t":2681.3,"s":"Kater","d":"Sehr gut! Psssst sie kommen!","p":30},{"t":2694.9,"s":"Kater","d":"Prinzessin? Jetzt dürft ihr gucken!","p":30},{"t":2700.2,"s":"Prinzessin","d":"Oh.... hübsch....Eine Wiese...","p":30},{"t":2701.8,"s":"Müller","d":"Na toll!","p":30},{"t":2706.6,"s":"Prinzessin","d":"Ich hatte erwartet, dass ihr mich endlich auf euer Schloss einladet.","p":30},{"t":2712.4,"s":"Kater","d":"Prinzessin, mit Verlaub. Ihr müsst schon so viele Schlösser gesehen haben in eurem Leben. Mein Graf ho te euch zu beeindrucken mit dieser Blumenpracht.","p":30},{"t":2722.5,"s":"Prinzessin","d":"Mmh!","p":30},{"t":2727.2,"s":"Kater","d":"Denn: wem gehört das alles hier?","p":30},{"t":2729.7,"s":"Publikum","d":"Graf Carabas!","p":31},{"t":2734.9,"s":"Müller","d":"Echt?","p":31},{"t":2736.3,"s":"Müller","d":"Au.","p":31},{"t":2736.9,"s":"Kater","d":"Na mach schon. Fordere sie auf zum Tanz.","p":31},{"t":2744.0,"s":"Prinzessin","d":"Au!","p":31},{"t":2747.7,"s":"Müller","d":"Oh! Verzeihung","p":31},{"t":2748.5,"s":"Prinzessin","d":"1, 2, 3 - 1, 2, 3, - 1, 2, 3, ...","p":31},{"t":2756.7,"s":"Müller","d":"1, 2, 3, ...So?","p":31},{"t":2768.7,"s":"Müller","d":"Au! Was soll das?","p":31},{"t":2770.7,"s":"Prinzessin","d":"Da war eine Mücke.","p":31},{"t":2772.8,"s":"Müller","d":"Wo?","p":31},{"t":2773.2,"s":"Müller","d":"Au!","p":31},{"t":2774.4,"s":"Prinzessin","d":"Da ist noch eine!","p":31},{"t":2776.0,"s":"Müller","d":"Oh Gott! Nicht die Mücken .Flieg woanders hin. Weg! Weg jetzt hier!","p":31},{"t":2782.8,"s":"Prinzessin","d":"Man muss ruhig bleiben.","p":32},{"t":2785.8,"s":"Müller","d":"Etwa so ruhig wie der da? Mach mal was!","p":32},{"t":2790.7,"s":"Kater","d":"Das liegt eigentlich nicht in meinem Aufgabenbereich!","p":32},{"t":2834.8,"s":"Kater","d":"Ist es jetzt angenehmen für euch?","p":32},{"t":2841.9,"s":"Prinzessin","d":"Ach, schau mal: Du hast da einen Mückenstich.","p":32},{"t":2847.1,"s":"Müller","d":"Oh...nein.","p":32},{"t":2848.5,"s":"Prinzessin","d":"Ach! Graf Carabas. Das ist doch ein schöner Aus ug.","p":32},{"t":2855.2,"s":"Müller","d":"Prinzessin...","p":32},{"t":2859.2,"s":"Prinzessin","d":"Iiiiii! Igitt, Igitt Igitt...ah! Eine Maus! Eine Maus! Äääääh!","p":32,"sc":"Die Teppich-Szene · Die Maus und der Elefant"},{"t":2863.8,"s":"Müller","d":"Kater! Jetzt tu endlich, wozu du erscha en wurdest!","p":32},{"t":2867.6,"s":"Kater","d":"knurrt den Müller an","p":32},{"t":2867.6,"s":"Prinzessin","d":"Mach sie weg! Mach sie tot! Mach sie tot! Mach sie weg! Ah!","p":32},{"t":2899.5,"s":"Kater","d":"Die \"Gefahr\" ist vorüber. Prinzessin.","p":33},{"t":2904.4,"s":"Prinzessin","d":"Versprochen?","p":33},{"t":2905.4,"s":"Kater","d":"Ja, nun wollen wir mal aus einer Maus keinen Elefanten machen!","p":33},{"t":2910.4,"s":"Müller","d":"Das heißt \"aus einer Mücke!\"","p":33},{"t":2913.5,"s":"Kater","d":"So ein Quatsch!","p":33},{"t":2917.0,"s":"Prinzessin","d":"Das wäre sehr schön!","p":33},{"t":2920.9,"s":"Prinzessin","d":"Wenn ihr mir einen Elefanten zeigen könntet! Ich habe noch nie einen gesehen!","p":33},{"t":2929.0,"s":"Müller","d":"Ach du dickes Ei!","p":33},{"t":2930.9,"s":"Prinzessin","d":"Ja! Das ist es! Ich habe mal gelesen: Die größten Eier legt der Elefantenvogel. Ich möchte einen sehen UND ein Elefanten-Ei essen!","p":33},{"t":2946.3,"s":"Müller","d":"Hä?","p":33},{"t":2948.4,"s":"Kater","d":"Der Elefantenvogel - Aepyornis Maximus ist lange ausgestorben.","p":33},{"t":2951.4,"s":"Prinzessin","d":"Oh....","p":33},{"t":2954.6,"s":"Müller","d":"Woher weißt du sowas? Ich sehe aus wie ein Trottel nehmen dir.","p":34},{"t":2961.6,"s":"Prinzessin","d":"Liebster Graf, euer Vertrauter ist sehr gescheit. Ob er nicht ein paar größere Eier bescha en könnte? Wenn sie auch nicht von einem... einem Aepy ... Dingsda... Elefantenvogel stammen....","p":34},{"t":2978.7,"s":"Müllers","d":"Mein \"Vertrauter\" hat MIR JEDEN Wunsch zu erfüllen Und von jetzt an auch EUCH, liebste Prinzessin.","p":34},{"t":2988.1,"s":"Prinzessin","d":"Vielen Dank.","p":34},{"t":2989.4,"s":"Müller","d":"Ich tue, was ich kann. So bin ich. ..Helf so vor mich hin.","p":34},{"t":3008.2,"s":"Kater","d":"Ich tue was ich kann! Mau!","p":34,"sc":"Die Teppich-Szene · Gespräch mit der Maus"},{"t":3010.8,"s":"Kater","d":"erschrickt","p":34},{"t":3021.1,"s":"Kater","d":"Ach du bist es...","p":34},{"t":3024.0,"s":"Maus","d":"Passen deine Stiefel noch?","p":34},{"t":3026.1,"s":"Kater","d":"Du, d - d - du kannst sprechen?","p":34},{"t":3032.3,"s":"Maus","d":"Ich kann noch mehr! Ich kann in die Zukunft schauen.","p":35},{"t":3039.4,"s":"Kater","d":"ach ja...?","p":35},{"t":3041.3,"s":"Maus","d":"Ich weiß wie deine Geschichte endet! Dein Lügen-Gebäude wird vor den Augen der Prinzessin einstürzen. Der Müller verliert seinen Traum! Du verlierst deinen einzigen Freund. Kein gestiefelter Kater. Nur ein Streuner, den niemand mehr haben will. Mietz, mietz, mietz, mietz, mietz!","p":35},{"t":3058.6,"s":"Kater","d":"Hau ab!","p":35}],"2":[{"t":16.2,"s":"Prinzessin","d":"1-2-3, 1-2-3, 1-2-3, 1-2-3, 1-2-3, 1-2-3, 1-2-3, 1-2-3.","p":36,"sc":"Eröffnung · Der Kater stört den Tanz"},{"t":19.6,"s":"Müller","d":"Komm. Laufen wir ein Stück. Siehst du da vorne? Der Sonnenuntergang? Nur eine Sache ist schöner.","p":36},{"t":31.6,"s":"Prinzessin","d":"Ihr schmeichelt mir.","p":36},{"t":36.7,"s":"Müller","d":"Ach, und schau die Leute an. Die lachen auch alle so schön. Ha. Du bist die Schönste.","p":36},{"t":42.7,"s":"Prinzessin","d":"Mein Graf. Ihr macht mich ganz verlegen.","p":36},{"t":45.6,"s":"Müller","d":"Ooh!","p":36},{"t":46.2,"s":"Prinzessin","d":"Mit euch an meiner Seite müsst ich mir wohl nie wieder in die Bäckchen kneifen.","p":36},{"t":53.0,"s":"Müller","d":"Wollen wir das machen?","p":36},{"t":55.0,"s":"Prinzessin","d":"Graf Carabas! Nicht doch!","p":36},{"t":57.2,"s":"Müller","d":"Nichts könnte schöner sein, als dieser Moment.","p":36},{"t":60.1,"s":"Kater","d":"Mau!","p":36},{"t":72.9,"s":"Prinzessin","d":"Ooh! Du bewegst dich geschmeidig, wie eine Katze. Oh!","p":36},{"t":78.9,"s":"Müller","d":"Was willst du? Wir sind beschäftigt. Nicht wahr?","p":37},{"t":82.2,"s":"Prinzessin","d":"kichert","p":37},{"t":85.3,"s":"Kater","d":"Darf ich bitten?","p":37},{"t":153.2,"s":"Prinzessin","d":"Ein temperamentvoller Kater!","p":37},{"t":158.1,"s":"Kater","d":"Bitte folgt mir. Ihr werdet es nicht bereuen.","p":37},{"t":164.4,"s":"Müller","d":"Was willst du?","p":37},{"t":166.3,"s":"Kater","d":"Mein Graf. Ich komme wegen des Auftrags, den ich für die Prinzessin ausführen sollte!","p":37},{"t":172.2,"s":"Müller","d":"Hä?","p":37},{"t":176.2,"s":"Kater","d":"Ihr wisst schon!","p":37},{"t":178.3,"s":"Müller","d":"Ah!","p":37},{"t":209.9,"s":"Prinzessin","d":"Huch! Was liegt da denn?","p":37},{"t":215.1,"s":"Müller","d":"Was soll das jetzt wieder?","p":37,"sc":"Die Strauße-Szene"},{"t":217.4,"s":"Kater","d":"Schon vergessen? Deine Prinzessin wollte dicke Eier!","p":37},{"t":247.4,"s":"Prinzessin","d":"Ah! Strauße!","p":38},{"t":247.5,"s":"Prinzessin","d":"Wem gehört die Straußenfarm?","p":38},{"t":247.8,"s":"Kater","d":"Zauberer Zam... Natürlich Graf Carabas!","p":38},{"t":249.9,"s":"Prinzessin","d":"Toll!","p":38},{"t":253.4,"s":"Müller","d":"Wouh!","p":38},{"t":256.9,"s":"Prinzessin","d":"Ich habs!","p":38},{"t":263.8,"s":"Kater","d":"Das sind die größten Eier, die ich nden konnte.","p":38},{"t":312.6,"s":"Müller","d":"Hier! Hier ist noch eins!","p":38},{"t":317.4,"s":"Prinzessin","d":"Juhu! Pass auf hier kommt noch eins.","p":38},{"t":324.4,"s":"Prinzessin","d":"Hier!","p":38},{"t":328.6,"s":"Müller","d":"Fang!","p":38},{"t":329.3,"s":"Kater","d":"Vorsicht.","p":38},{"t":330.2,"s":"Müller","d":"Wo bleibt dein Jagdinstinkt?","p":38},{"t":332.9,"s":"Kater","d":"Wo bleibt deine Vernunft? Alberner Eiertanz!","p":38},{"t":378.5,"s":"Müller","d":"Pass auf! Hier! Hier ist noch eins! Wouh!","p":38},{"t":381.9,"s":"Prinzessin","d":"Gefangen!","p":38},{"t":395.3,"s":"Prinzessin","d":"Puh! Es wird bereits dunkel. Vor lauter Vergnügen habe ich die Zeit vergessen. Danke lieber Graf Carabas.","p":39},{"t":404.5,"s":"Müller","d":"Ich tue, was ich kann, um euch glücklich zu sehen.","p":39},{"t":411.4,"s":"Müller","d":"Was ist?","p":39},{"t":413.1,"s":"Kater","d":"Mein Graf, auf ein Wort - unter vier Augen?","p":39},{"t":420.7,"s":"Müller","d":"Wenn es sein muss.","p":39},{"t":425.7,"s":"Müller","d":"Was willst du? Es läuft gerade so gut mit ihr.","p":39},{"t":429.1,"s":"Kater","d":"Und wem verdankst du das?","p":39},{"t":431.6,"s":"Müller","d":"Sie mag mich. Mit oder ohne dein Zutun!","p":39},{"t":435.7,"s":"Kater","d":"Du hast keine Ahnung, was ich für dich getan habe.","p":39},{"t":440.5,"s":"Müller","d":"Ich habe dich nicht um Hilfe gebeten. DU hast sie mir angeboten.","p":39},{"t":446.6,"s":"Kater","d":"Wenn das so ist, viel Glück. Eine Frage aber noch: Wo willst du denn in Zukunft wohnen mit deiner Prinzessin? Ohne Schloss?","p":39},{"t":458.7,"s":"Müller","d":"Ich... ich... .","p":39},{"t":462.4,"s":"Kater","d":"Ich kümmere mich darum!","p":40},{"t":467.3,"s":"Prinzessin","d":"Ist alles in Ordnung mein Lieber?","p":40},{"t":470.4,"s":"Müller","d":"Ja!","p":40},{"t":475.5,"s":"Prinzessin","d":"Und wann zeigst du mir dein Schloss?","p":40},{"t":484.5,"s":"Zauberer","d":"Zauberer Zampano!!! Der größte Magier aller Zeiten! ...der viel mehr Bewunderung verdient hätte!","p":40},{"t":489.9,"s":"Person","d":"\"zauberhaft\"!","p":40},{"t":678.9,"s":"Zauber","d":"So viel Bewunderung ich werde ganz rot!","p":40},{"t":687.3,"s":"Person","d":"Ihr gehört auf eine große Bühne!","p":40},{"t":693.2,"s":"Zauberer","d":"Ich weiß!","p":40,"sc":"Das Lied des Zauberers"},{"t":706.2,"s":"Kater","d":"Zampano! Was für eine Darbietung. Ich würde applaudieren, aber meine leisen Pfoten.","p":40},{"t":718.4,"s":"Zauberer","d":"Was willst du hier?","p":40},{"t":720.5,"s":"Kater","d":"Ich war zufällig in der Gegend. Ich bin beeindruckt. Ihr verdient ein viel größeres Publikum!","p":41},{"t":734.5,"s":"Zauberer","d":"Was nützt das größte Publikum, wenn es kleingeistig ist.","p":41},{"t":741.4,"s":"Kater","d":"Wem sagt ihr das! Ich habe selbst zu kämpfen mit dem simplen Verstand meines Herren. ABER: Die Prinzessin scheint eine Frau von Welt zu sein. Sie erkennt wahres Können!","p":41},{"t":758.2,"s":"Zauberer","d":"Sprich weiter, sprich weiter!","p":41},{"t":761.1,"s":"Kater","d":"Stellt Euch vor...nicht hier.... in der Stadt. Ich sorge dafür, dass die Königin und die Prinzessin im Publikum sind. Und IHR zaubert etwas, dass ihnen die Stiefel auszieht!","p":41},{"t":779.1,"s":"Zauberer","d":"Und was wäre das?","p":41},{"t":781.4,"s":"Kater","d":"Ein E-le-fant.","p":41},{"t":788.6,"s":"Zauberer","d":"Ein ELEFANT???","p":41},{"t":789.6,"s":"Kater","d":"N-n-nur, wenn es Euch keine Umstände macht einen herbeizuzaubern.....großer Zampano Zampaaano","p":41},{"t":800.6,"s":"Zauberer","d":"\"Herbeizuzaubern?\" Ich kann mich selbst in einen verwandeln!","p":41},{"t":807.0,"s":"Kater","d":"Mau! Dann machen wir es so?","p":41},{"t":814.6,"s":"Zauberer","d":"K-k-k-k- kein Körperkontakt!","p":41},{"t":819.9,"s":"Kater","d":"Verzeihung! Ich bereite alles vor großer Zampaaaano!","p":41},{"t":826.8,"s":"Zauberer","d":"ZAMPANO!!!","p":41},{"t":827.2,"s":"Kater","d":"Zauberer Zampaaaano Zampano.","p":42},{"t":867.2,"s":"Kater","d":"Kommt näher! Kommt ran! Kommt, kommt, kommt, Leute! Eine große Show erwartet euch. Das habt ihr noch nie gesehen! Nehmt Platz! Setzt euch!","p":42,"sc":"Die Elefantenshow"},{"t":881.8,"s":"Kater","d":"Stopp, stopp, stopp, stopp, stopp, stopp, stopp! Hier ist reserviert für die königliche Familie!","p":42},{"t":893.6,"s":"Kater","d":"Macht Platz da! Aus dem Weg! Weg da!","p":42},{"t":897.0,"s":"Prinzessin","d":"Ich liiiiiebe Überraschungen!","p":42},{"t":910.6,"s":"Kater","d":"Prinzessin. Diese ist im besonderen für Euch!","p":42},{"t":913.5,"s":"Prinzessin","d":"Ohhohooo!","p":42},{"t":918.4,"s":"Kater","d":"Schschsch! Euer Majestät, Prinzessin, Graf Carabas. Dank meines Einsatzes ist es gelungen, einen großen Künstler zu einem noch größeren Auftritt zu bewegen. Zauberer Zampano!","p":42},{"t":941.5,"s":"Königin","d":"Ach! Der große ...Angeber... Na das ist ja mal was Neues!","p":42},{"t":946.1,"s":"Zauberer","d":"Zack Zack!","p":43},{"t":958.9,"s":"Kater","d":"Applaus! Applaus! Applaus!","p":43},{"t":960.1,"s":"Zauberer","d":"...naja...","p":43},{"t":972.8,"s":"Zauberer","d":"\"Zack, Zack\"!","p":43},{"t":1035.9,"s":"Prinzessin","d":"Fantastisch! Wie hat er DAS gemacht?","p":44},{"t":1041.6,"s":"Königin","d":"Ach Kind! Das ist Zauberei! Das ist ja endlich wirklich mal was ganz neues!","p":44},{"t":1049.6,"s":"Prinzessin","d":"Ich meine nicht den Zauberer! Wie hat dein Kater das so schnell organisiert für mich?","p":44},{"t":1058.2,"s":"Müller","d":"Er tut nur, was ich ihm auftrage!","p":44},{"t":1061.1,"s":"Kater","d":"Haaaaaalt!","p":44},{"t":1086.2,"s":"Prinzessin","d":"So nah! Wow! Darf ich ihn streicheln?","p":44},{"t":1091.6,"s":"Kater","d":"Er ist zahm wie ein Kätzchen!","p":44},{"t":1099.4,"s":"Prinzessin","d":"Wie wunderschön!","p":44},{"t":1100.2,"s":"Prinzessin","d":"Wohou!","p":44},{"t":1105.5,"s":"Müller","d":"Oh!","p":44},{"t":1110.8,"s":"Leute","d":"applaudieren; jubeln","p":44},{"t":1126.7,"s":"Kater","d":"Oh, oh!","p":45},{"t":1129.0,"s":"Prinzessin","d":"Oh Gott!","p":45},{"t":1133.8,"s":"Müller","d":"Um Gottes Willen!","p":45},{"t":1135.8,"s":"Prinzessin","d":"Nein!","p":45},{"t":1136.2,"s":"Königin","d":"Furchtbar!","p":45},{"t":1139.6,"s":"Müller","d":"Oh Gott!","p":45},{"t":1142.9,"s":"Prinzessin","d":"Nein, nein, nein... bitte nicht! Rette mich doch jemand!","p":45},{"t":1158.1,"s":"Müller","d":"Pfeif dieses Monster zurück!","p":45},{"t":1161.7,"s":"Königin","d":"Nein! Bitte nicht pfeifen! Um Gottes Willen nicht pfeifen! Das macht ihn doch wütender!","p":45},{"t":1170.0,"s":"Kater","d":"Zampaaaaano? Zampaaaaaano? Zampano! Bist du da drin?","p":46},{"t":1173.0,"s":"Müller","d":"Oh Gott!","p":46},{"t":1174.7,"s":"Prinzessin","d":"Ich bin noch zu jung und zu hübsch, um zu sterben. Aaaaah!","p":46},{"t":1185.0,"s":"Müller","d":"Nimm meine Hand.","p":46},{"t":1192.0,"s":"Müller","d":"Es tut mir so leid.","p":46},{"t":1220.8,"s":"Prinzessin","d":"Warum - warum hat keiner schneller reagiert?","p":46},{"t":1225.8,"s":"Königin","d":"Schätzchen, meine Kleine. Ach mein Schätzchen. Beruhige dich doch. Beruhige Dich. Ganz ruhig.","p":46},{"t":1240.6,"s":"Kater","d":"Bitte. Es gibt nicht zu sehen. Die Show ist zu Ende. Geht nach hause. Los!","p":46},{"t":1249.1,"s":"Einzelne","d":"Furchtbar! Tiere sind eben unberechenbar! Zampano aber auch! Und dieser Kater....ein Halunke. Katastrophal.","p":46},{"t":1268.9,"s":"Müller","d":"Bist du wahnsinnig? DU hättest sie fast getötet!","p":47,"sc":"Die Anschuldigung"},{"t":1274.7,"s":"Kater","d":"Ich habe ihr einen Wunsch erfüllt.","p":47},{"t":1278.8,"s":"Müller","d":"Wann hat sie sich gewünscht zu sterben?","p":47},{"t":1282.2,"s":"Kater","d":"Ohne mich wärst du immer noch ein Niemand.","p":47},{"t":1286.8,"s":"Müller","d":"Lieber ein Niemand als ein Mörder.","p":47},{"t":1292.0,"s":"Prinzessin","d":"Warum wärst du ein Niemand?","p":47},{"t":1297.8,"s":"Königin","d":"Wir gehen. Ihr habt das Leben meiner Tochter in Gefahr gebracht.","p":47},{"t":1304.1,"s":"Müller","d":"Majestät! Majestät....","p":47},{"t":1317.9,"s":"Müller","d":"Jetzt bin ich DEINETWEGEN ein Niemand. Die Prinzessin mochte mich. Du bist Schuld, wenn Sie mich nie mehr sehen will. Und belogen hast du mich auch. Sie hat mir erzählt, dass die Königin dir sehr wohl Gold gegeben hat für die Rebhühner.","p":47},{"t":1333.6,"s":"Kater","d":"Ich habe keinen Taler davon für mich ausgegeben. .... nur einmal für die Milchkuh....Ich habe das meiste ausgegeben, um dir zu helfen.","p":47},{"t":1347.0,"s":"Müller","d":"Weißt du was? Du kannst gehen! Hau ab. Ich pfeif auf dich. Ich lehne das Erbe meines Vaters ab!. Du bist \"frei\". Herzlichen Glückwunsch.","p":47},{"t":1360.2,"s":"Müller","d":"Auch wenn du ein paar Stiefel trägst, du bist immer noch der selbe nutzlose Kater!","p":48},{"t":1432.2,"s":"Müller","d":"Nutzlos! Ein Kater, der keine Mäuse fängt!\"","p":48},{"t":1516.0,"s":"Königin","d":"\"Ein Kater in Stiefeln? Lächerlich!","p":48},{"t":1518.1,"s":"Prinzessin","d":"Maßgeschneidert, sagt er. . Er ist ein Lügner!","p":48,"sc":"Der Albtraum"},{"t":1609.0,"s":"Kater","d":"Zeigt mir EIN Tier, das sprechen kann, wie ein Mensch, aufrecht steht, bei der Königin ein und ausgeht. Einen einfachen Müllersjungen mit der Prinzessin verkuppelt. Zeigt mir ein Tier so klug wie ich! Ich habe das alles gescha t! ALLEINE! Wenn ihr einen Schuldigen sucht, dann, dann nehmt den Zampano, den Zampaaaaano! Den Zampano!","p":48},{"t":1685.3,"s":"Zauberer","d":"Was willst du?","p":48,"sc":"Der Kater stellt den Zauberer · Jagd auf die Maus"},{"t":1687.4,"s":"Kater","d":"Du hast alles zerstört.","p":48},{"t":1693.4,"s":"Zauberer","d":"Ich habe ihnen eine Show geboten, die sie nicht vergessen werden.","p":48},{"t":1699.5,"s":"Kater","d":"Du hast ihnen Angst gemacht und alles ruiniert, was ICH aufgebaut habe.","p":49},{"t":1708.0,"s":"Zauberer","d":"Minkus, Minkus, Minkus....! Mieze-Kater! Du bist nur das, was du bist, weil ich es zugelassen habe.","p":49},{"t":1719.9,"s":"Kater","d":"Ich habe mir das selbst erarbeitet.","p":49},{"t":1724.0,"s":"Zauberer","d":"Hast du das? Oder hast du nur benutzt, was ich dir gegeben habe? Stimme. Verstand. Ehrgeiz. Du warst ein Kater. Ein miserabler noch dazu!","p":49},{"t":1741.7,"s":"Kater","d":"Nein.","p":49},{"t":1743.7,"s":"Zauberer","d":"Ich war schon ein bisschen beleidigt, dass du mich bei unserer ersten Begegnung nicht kriegen wolltest.","p":49},{"t":1751.3,"s":"Kater","d":"Wie meinst du das?","p":49},{"t":1753.7,"s":"Zauberer","d":"Ach Minkus....","p":49},{"t":1763.7,"s":"Zauberer","d":"Hier bin ich!","p":49},{"t":1765.0,"s":"Kater","d":"Was?","p":49},{"t":1767.5,"s":"Zauberer","d":"Hier war ich von Anfang an. Fängst du mich dieses mal?","p":49},{"t":1772.1,"s":"Maus","d":"Dann eben nicht.","p":49},{"t":1783.9,"s":"Kater","d":"Du... bist der Zauberer.....","p":49},{"t":1794.9,"s":"Maus","d":"mal sehen, was du aus den Fähigkeiten, die ich dir gegeben habe, machst.","p":49},{"t":1805.0,"s":"Kater","d":"Du wolltest sehen....","p":49},{"t":1810.6,"s":"Kater","d":"Mau!!!","p":50},{"t":1815.0,"s":"Kater","d":"Wo steckst du?","p":50},{"t":1828.2,"s":"Maus","d":"Piep, piep, piep, piep, piiiep, piep!","p":50},{"t":1863.3,"s":"Kater","d":"Sieh genau hin!","p":50},{"t":1975.1,"s":"Maus","d":"Sieh DU genau hin! Miserabler Kater!","p":50,"sc":"Die Enthüllung"},{"t":1983.5,"s":"Kater","d":"Na sowas?! Ich kann immer noch sprechen! Ich bin noch der gestiefelte Kater...und ich bin allein.","p":51},{"t":1990.2,"s":"Müller","d":"Minkus! Minkuuuus!","p":51},{"t":2018.3,"s":"Müller","d":"Was hast du getan?","p":51},{"t":2022.0,"s":"Kater","d":"Du wolltest doch, dass ich die Maus fange.","p":51},{"t":2026.6,"s":"Müller","d":"Ich wollte nur.... Ich wollte nur etwas anderes sein, als ich bin. Etwas darstellen, schätze ich.","p":51},{"t":2040.7,"s":"Kater","d":"Da haben wir was gemeinsam. Aber ich weiß jetzt was in mir steckt.","p":51},{"t":2050.1,"s":"Müller","d":"Eine Maus?","p":51},{"t":2056.6,"s":"Kater","d":"Das auch. ....und: ein Zauberer schätze ich.","p":52},{"t":2061.2,"s":"Müller","d":"Nein!","p":52},{"t":2061.6,"s":"Kater","d":"Doch...","p":52},{"t":2063.4,"s":"Müller","d":"Oh!","p":52},{"t":2067.1,"s":"Müller","d":"Ist dir schlecht?","p":52},{"t":2072.4,"s":"Müller","d":"Hier?","p":52},{"t":2076.6,"s":"Kater","d":"ein bisschen weiter da?","p":52},{"t":2103.8,"s":"Prinzessin","d":"Liebster! Liebster! Graf Carabas!","p":52},{"t":2109.5,"s":"Müller","d":"Prinzessin!","p":52},{"t":2113.6,"s":"Prinzessin","d":"Liebster!","p":52},{"t":2115.5,"s":"Müller","d":"Liebster?","p":52},{"t":2118.9,"s":"Prinzessin","d":"Liebster! Ich habe mir Sorgen gemacht. Ich bin froh, dass ich dich gefunden habe.","p":52},{"t":2130.4,"s":"Königin","d":"Oh! Oh! Was für ein Palast! Mein Gott ist der schön. Das ist ja wirklich mal was Neues. Habt ihr Rebhühner in der Küche?","p":52,"sc":"Die Wiedervereinigung"},{"t":2149.0,"s":"Kater","d":"Euer Hoheit. Wie schön. Endlich dürfen wir Euch in unserem bescheidenen Schloss empfangen.","p":52},{"t":2160.6,"s":"Müller","d":"Wa? Hä? Mmh?","p":52},{"t":2163.3,"s":"Müller","d":"J-j-ja! Endlich. Willkommen!","p":53},{"t":2167.1,"s":"Königin","d":"Bescheiden? Es ist prachtvoll. Dann steht einer Hochzeit jetzt nichts mehr im Wege!","p":53},{"t":2172.6,"s":"Kater","d":"Mau!","p":53},{"t":2265.6,"s":"Königin","d":"Verehrte Herrschaften! Ich habe da für euch und uns alle einmal etwas ganz neues! Verehrter Kater kommt zu mir. In Anbetracht dessen, dass meine Tochter ihren Traummann gefunden hat und diese Verbindung nur zustande gekommen ist, weil dieser Kater mir im Namen des Grafen Carabas einst köstliche Rebhühner überbrachte, - also in Anbetracht dieser wundervollen Tatsache - ernenne ich Euch, mein lieber hoch geschätzter gestiefelter Kater, zum ersten Minister!","p":53,"sc":"Das Finale"},{"t":2313.9,"s":"Kater","d":"Ich nehme die Beförderung an. Aber nur, wenn ich keine Mäuse mehr fangen muss...","p":53},{"t":2320.2,"s":"Kater","d":"Mau!","p":53}]};

    });

    m.innerHTML = h; markNow(); return;
  }
  const roleOpts = '<option value="">– keine –</option>' + ROLES.map(r => '<option' + (r === role ? ' selected' : '') + '>' + esc(r) + '</option>').join('');
  const panel = '<details class="panel"' + (role ? '' : ' open') + '><summary>🎭 Meine Rolle' + (role ? ': ' + esc(role) : '') + ' <span>▾</span></summary>' +
    '<div class="row"><select id="roleSel" aria-label="Meine Rolle">' + roleOpts + '</select></div>' +
    '<div class="row"><label class="chk"><input type="checkbox" id="onlyMine"' + (onlyMine ? ' checked' : '') + '> Nur meine Zeilen zeigen</label></div>' +
    '<div class="row"><label class="chk"><input type="checkbox" id="conceal"' + (conceal ? ' checked' : '') + '> Meine Zeilen verdecken (zum Antippen = lesen)</label></div>' +
    '<div class="hint">Mit einer Rolle erscheinen unten die Knöpfe „meine Zeile“. Sie springen zur Zeile davor, damit du dein Stichwort hörst.</div></details>';
  const a = SCRIPT[part]; let h = ''; let sceneIdx = 0;
  a.forEach((l, i) => {
    if (l.sc) h += '<div class="scene" data-t="' + l.t + '"><b>' + esc(SCENE_DE[l.sc] || l.sc) + '</b><small>' + fmt(l.t) + '</small></div>';
    const mine = role && l.s === role;
    h += '<div class="line' + (mine ? ' mine' : '') + (onlyMine && role && !mine ? ' off' : '') + '" id="l' + i + '" data-i="' + i + '" style="--sc:' + spColor(l.s) + '"><div class="sp">' + esc(l.s) + '<i>' + (l.p ? 'S. ' + l.p + ' · ' : '') + fmt(l.t) + '</i></div><div class="tx">' + prettyDe(l.d) + '</div></div>';
  });
  h += '<div class="hint" style="margin:18px 2px">Die Zeilen sind automatisch mit der Aufnahme synchronisiert und können an manchen Stellen leicht abweichen. Tippe auf eine Zeile, um dort weiterzuhören.</div>';
  m.innerHTML = seg + panel + '<div id="script" class="' + (conceal && role ? 'conceal' : '') + '">' + h + '</div>';
  active = -1; updateActive(true);
  const rs = $('roleSel'); if (rs) rs.onchange = () => { role = rs.value; store.set('role', role); render(); syncMineBtns(); };
  const om = $('onlyMine'); if (om) om.onchange = () => { onlyMine = om.checked; store.set('only', onlyMine ? '1' : '0'); render(); };
  const cc = $('conceal'); if (cc) cc.onchange = () => { conceal = cc.checked; store.set('conceal', conceal ? '1' : '0'); render(); };
}
function markNow() { if (tab !== 'scenes') return; const cur = loadedPart === part ? sceneOf(part, lineAt(part, au.currentTime)) : -1; document.querySelectorAll('.scenecard').forEach(b => b.classList.toggle('now', loadedPart && b.dataset.sc === part + '-' + cur && !au.paused)); }
function syncMineBtns() { const d = role ? '' : 'none'; $('bMinePrev').style.display = d; $('bMineNext').style.display = d; }
function buildTicks() { const t = $('ticks'); t.innerHTML = ''; const dur = au.duration; if (!isFinite(dur) || loadedPart !== part) return; SCENES[part].forEach(s => { const i = document.createElement('i'); i.style.left = (s.t / dur * 100) + '%'; t.appendChild(i); }); }

function updateActive(force) {
  const t = loadedPart === part ? au.currentTime : pos(part);
  const i = lineAt(part, t);
  if (i === active && !force) return;
  if (tab === 'hear') {
    const old = document.querySelector('.line.now'); if (old) old.classList.remove('now');
    const el = $('l' + i);
    if (el && (loadedPart === part || force)) { if (loadedPart === part && !au.paused || loadedPart === part && au.currentTime > 0) el.classList.add('now'); if (follow && !(onlyMine && role && el.classList.contains('off'))) { if (loadedPart === part && !au.paused) el.scrollIntoView({ block: 'center', behavior: i === active + 1 ? 'smooth' : 'auto' }); } }
  }
  active = i;
  const l = SCRIPT[part][i]; $('nowLine').textContent = l ? l.s + ': ' + l.d.replace(/\s+/g, ' ') : ' ';
  markNow();
}

// ---- audio loading (the recording is two files per part; they are glued together so seeking works everywhere) ----
function setMsg(h) { $('msg').innerHTML = h || ''; }
function showProg(f) { $('prog').style.display = f == null ? 'none' : 'block'; if (f != null) $('progI').style.width = Math.round(f * 100) + '%'; }
async function fetchChunk(url, size, onN) {
  const r = await fetch(url); if (!r.ok) throw new Error('HTTP ' + r.status);
  if (!r.body || !r.body.getReader) { const b = await r.blob(); onN(b.size); return b; }
  const rd = r.body.getReader(), parts = []; for (;;) { const x = await rd.read(); if (x.done) break; parts.push(x.value); onN(x.value.length); }
  return new Blob(parts, { type: 'audio/mpeg' });
}
const blobUrls = {};
function ensureAudio(p) {
  if (loadedPart === p && au.src) return Promise.resolve();
  if (loading && loading.p === p) return loading.pr;
  const pr = (async () => {
    if (!blobUrls[p]) {
      const info = PARTS[p], total = info.bytes[0] + info.bytes[1]; let got = 0; const blobs = [];
      setMsg('Aufnahme wird geladen … (beim ersten Mal ca. ' + Math.round(total / 1048576) + ' MB)'); showProg(0);
      for (let i = 0; i < 2; i++) blobs.push(await fetchChunk(info.files[i], info.bytes[i], n => { got += n; showProg(Math.min(1, got / total)); setMsg('Aufnahme wird geladen … ' + Math.min(99, Math.round(got / total * 100)) + ' %'); }));
      blobUrls[p] = URL.createObjectURL(new Blob(blobs, { type: 'audio/mpeg' })); showProg(null);
    }
    au.src = blobUrls[p]; loadedPart = p;
    await new Promise((res, rej) => { if (au.readyState >= 1) return res(); au.onloadedmetadata = () => res(); au.onerror = () => rej(new Error('decode')); });
    au.playbackRate = parseFloat($('rate').value) || 1; setMsg(''); $('tTot').textContent = fmt(au.duration); buildTicks();
  })();
  loading = { p, pr }; pr.then(() => { loading = null; }, e => { loading = null; showProg(null); setMsg('Die Aufnahme konnte nicht geladen werden. Bitte Internetverbindung prüfen. <button id="retry">Erneut versuchen</button>'); const b = $('retry'); if (b) b.onclick = () => { setMsg(''); if (pending) go(pending.p, pending.t, pending.play); }; });
  return pr;
}
async function go(p, t, play) {
  pending = { p, t, play };
  if (p !== part) setPart(p, false);
  try { await ensureAudio(p); } catch (e) { return; }
  if (part !== p) return;
  au.currentTime = Math.max(0, Math.min(t, (au.duration || t) - 0.5)); updateActive(true);
  if (play) { try { await au.play(); } catch (e) { setMsg('Zum Abspielen bitte auf ▶ tippen.'); } }
}
function setPart(p, rerender) {
  if (p === part && rerender !== true) return;
  if (loadedPart && loadedPart !== p) { au.pause(); }
  part = p; store.set('part', p); active = -1; follow = true;
  if (loadedPart === p) { $('tTot').textContent = fmt(au.duration); } else { $('tTot').textContent = '–:––'; $('seek').value = 0; $('tCur').textContent = fmt(pos(p)); }
  buildTicks(); render(); updateButtons();
  if (tab === 'hear' && loadedPart !== p) { const i = lineAt(p, pos(p)); const el = $('l' + i); if (el && pos(p) > 1) el.scrollIntoView({ block: 'center' }); }
}
function updateButtons() { const playing = loadedPart === part && !au.paused; $('bPlay').textContent = playing ? '⏸' : '▶'; $('bPlay').setAttribute('aria-label', playing ? 'Pause' : 'Abspielen'); }

// ---- events ----
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-part],.line,.scene,.scenecard'); if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b === t)); $('follow').style.display = 'none'; render(); window.scrollTo(0, 0); return; }
  if (t.classList.contains('scenecard')) { tab = 'hear'; document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === 'hear')); follow = true; const p = t.dataset.part, tt = parseFloat(t.dataset.t); setPart(p, true); go(p, tt, true); return; }
  if (t.dataset.part) { setPart(t.dataset.part, true); return; }
  if (t.classList.contains('scene')) { follow = true; go(part, parseFloat(t.dataset.t), true); return; }
  if (t.classList.contains('line')) {
    if (conceal && role && t.classList.contains('mine') && !t.classList.contains('peek')) { t.classList.add('peek'); return; }
    follow = true; go(part, SCRIPT[part][+t.dataset.i].t, true);
  }
});
$('bPlay').onclick = async () => {
  if (loadedPart === part && !au.paused) { au.pause(); return; }
  if (loadedPart === part) { try { await au.play(); } catch (e) {} return; }
  follow = true; go(part, pos(part), true);
};
$('bBack').onclick = () => { if (loadedPart === part) au.currentTime = Math.max(0, au.currentTime - 10); };
$('bFwd').onclick = () => { if (loadedPart === part) au.currentTime = Math.min(au.duration, au.currentTime + 10); };
$('rate').onchange = () => { au.playbackRate = parseFloat($('rate').value) || 1; store.set('rate', $('rate').value); };
function stepScene(d) {
  const t = loadedPart === part ? au.currentTime : pos(part), s = SCENES[part]; let k = -1; for (let j = 0; j < s.length; j++) if (s[j].t <= t + 1) k = j;
  let n = d > 0 ? k + 1 : (t - s[Math.max(k, 0)].t > 4 ? k : k - 1); if (n < 0 || n >= s.length) return; follow = true; go(part, s[n].t, !(loadedPart === part && au.paused) || true);
}
$('bSceneNext').onclick = () => stepScene(1); $('bScenePrev').onclick = () => stepScene(-1);
function stepMine(d) {
  if (!role) return; const a = SCRIPT[part], cur = lineAt(part, loadedPart === part ? au.currentTime : pos(part)); let n = -1;
  if (d > 0) { for (let i = cur + 1; i < a.length; i++) if (a[i].s === role) { n = i; break; } }
  else { for (let i = cur - 1; i >= 0; i--) if (a[i].s === role) { n = i; break; } }
  if (n < 0) { setMsg('Keine weitere Zeile für ' + esc(role) + ' in diesem Teil.'); setTimeout(() => setMsg(''), 2500); return; }
  const from = Math.max(0, n - 1); follow = true; go(part, a[from].t, true);
}
$('bMineNext').onclick = () => stepMine(1); $('bMinePrev').onclick = () => stepMine(-1);
const seek = $('seek');
seek.addEventListener('input', () => { seeking = true; if (isFinite(au.duration) && loadedPart === part) $('tCur').textContent = fmt(seek.value / 1000 * au.duration); });
seek.addEventListener('change', () => { seeking = false; if (isFinite(au.duration) && loadedPart === part) { au.currentTime = seek.value / 1000 * au.duration; follow = true; updateActive(true); } else { seek.value = 0; go(part, pos(part), true); } });
['touchmove', 'wheel'].forEach(ev => window.addEventListener(ev, () => { if (tab === 'hear' && loadedPart === part && !au.paused) { follow = false; $('follow').style.display = 'block'; } }, { passive: true }));
$('follow').onclick = () => { follow = true; $('follow').style.display = 'none'; const el = $('l' + active); if (el) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); };
let lastSave = 0;
au.addEventListener('timeupdate', () => {
  if (loadedPart !== part) return;
  if (!seeking) { $('tCur').textContent = fmt(au.currentTime); if (isFinite(au.duration) && au.duration) seek.value = Math.round(au.currentTime / au.duration * 1000); }
  updateActive(false);
  const n = Date.now(); if (n - lastSave > 4000) { lastSave = n; store.set('pos' + part, String(au.currentTime)); }
  if (follow && $('follow').style.display !== 'none') $('follow').style.display = 'none';
});
function scrollActive(smooth) { if (tab !== 'hear') return; const el = $('l' + active); if (el) { const l = document.querySelector('.line.now'); if (l && l !== el) l.classList.remove('now'); el.classList.add('now'); el.scrollIntoView({ block: 'center', behavior: smooth ? 'smooth' : 'auto' }); } }
['play', 'pause', 'ended'].forEach(ev => au.addEventListener(ev, () => { updateButtons(); markNow(); if (ev === 'play' && follow) setTimeout(() => scrollActive(false), 60); if (ev !== 'play' && loadedPart) store.set('pos' + loadedPart, String(au.currentTime)); }));
au.addEventListener('ended', () => { if (part === '1') setMsg('Ende von Teil 1. <button id="toP2">Weiter mit Teil 2</button>'); const b = $('toP2'); if (b) b.onclick = () => { setMsg(''); store.set('pos2', '0'); setPart('2', true); go('2', 0, true); }; });
document.addEventListener('visibilitychange', () => { if (document.hidden && loadedPart) store.set('pos' + loadedPart, String(au.currentTime)); });
// lock-screen controls
if ('mediaSession' in navigator) {
  try {
    navigator.mediaSession.metadata = new MediaMetadata({ title: 'Der gestiefelte Kater', artist: 'Hörspiel', album: 'Teil ' + part });
    navigator.mediaSession.setActionHandler('play', () => au.play()); navigator.mediaSession.setActionHandler('pause', () => au.pause());
    navigator.mediaSession.setActionHandler('seekbackward', () => { au.currentTime = Math.max(0, au.currentTime - 10); }); navigator.mediaSession.setActionHandler('seekforward', () => { au.currentTime = Math.min(au.duration, au.currentTime + 10); });
  } catch (e) {}
}
syncMineBtns(); setPart(part, true);
$('tCur').textContent = fmt(pos(part));
if (pos(part) > 5) setMsg('Weiter bei ' + fmt(pos(part)) + ' · tippe auf ▶');
else setMsg('Tippe auf ▶ oder auf eine Zeile. Die Aufnahme (ca. 25 MB) wird beim ersten Mal geladen.');
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
